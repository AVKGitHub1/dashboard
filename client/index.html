<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom is deliberately left enabled (no maximum-scale / user-scalable=no) — the
         16px mobile control font in index.css is what stops iOS from auto-zooming when
         an input takes focus, so pinch-zoom stays available for accessibility. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 'black' (rather than 'black-translucent') keeps iOS laying the web app out
         below the status bar / notch, so no safe-area insets are needed to stop the
         top bar from sliding underneath it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Dashboard" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-96.png" sizes="96x96" />
    <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
